<div class="login-page">
  <div class="login-card">
    <h1>Reset Password</h1>
    <p class="subtitle">
      Request an OTP, then set a new password.
      <span *ngIf="mockOtp()">Dev OTP: <strong>{{ mockOtp() }}</strong></span>
    </p>

    <form *ngIf="step() === 'request'" (ngSubmit)="requestOtp()">
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending...' : 'Send OTP' }}
      </button>
    </form>

    <form *ngIf="step() === 'reset'" (ngSubmit)="resetPassword()">
      <label>
        OTP Code
        <input type="text" name="code" [(ngModel)]="code" required />
      </label>
      <label>
        New Password
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </label>
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving...' : 'Reset Password' }}
      </button>
    </form>

    <p class="footer-link"><a routerLink="/login">Back to login</a></p>
  </div>
</div>
